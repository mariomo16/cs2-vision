<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CS2 Vision</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="csl-popup">
      <div class="csl-popup-body">
        <img
          class="csl-popup-icon"
          src="../assets/icons/icon512.png"
          alt="CS2 Vision"
        />
        <div class="csl-popup-info">
          <h1 class="csl-popup-title">CS2 Vision</h1>
          <p class="csl-popup-line">
            <span class="csl-popup-label">Current Version:</span>
            <span class="csl-popup-value" id="csl-current-version"></span>
          </p>
          <p class="csl-popup-line">
            <span class="csl-popup-label">Latest Version:</span>
            <span class="csl-popup-value" id="csl-latest-version"></span>
          </p>
          <p class="csl-popup-line" id="csl-release-date"></p>
        </div>
      </div>
    </main>
    <script src="popup.js" defer></script>
  </body>
</html>
